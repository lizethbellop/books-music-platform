spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/BDAuth_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Seguridad / JWT datos ficticios
application.security.jwt.secret-key=${JWT_SECRET:${random.value}${random.value}}
application.security.jwt.expiration=${JWT_EXPIRATION:300000}
application.security.jwt.refresh-token.expiration=${REFRESH_TOKEN_EXPIRATION:2400000}

# Bloqueo de cuenta
application.security.lock.max-failed-attempts=${MAX_FAILED_ATTEMPTS:3}
application.security.lock.time-minutes=${LOCK_TIME_MINUTES:5}

# Configuración SMTP para Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:noreply@usi.com}
spring.mail.password=${MAIL_PASSWORD:contrasena_falsa_de_prueba}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true