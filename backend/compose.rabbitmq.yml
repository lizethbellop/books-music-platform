services:
  rabbitmq:
    image: rabbitmq:4-management

    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Define RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: musa

    volumes:
      - musa_rabbitmq_data:/var/lib/rabbitmq

volumes:
  musa_rabbitmq_data: