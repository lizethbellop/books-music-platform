server.port=8086
spring.application.name=communities-service-test

# Base de datos PostgreSQL aislada para PRUEBAS
spring.datasource.url=jdbc:postgresql://localhost:5432/communities_test_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA para Pruebas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Seguridad JWT
musa.security.jwt.secret=${JWT_SECRET}