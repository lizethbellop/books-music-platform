server.port=8086
spring.application.name=communities-service

# Base de datos PostgreSQL para Communities
spring.datasource.url=jdbc:postgresql://localhost:5432/communities_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Seguridad JWT
spring.config.import=optional:file:.env[.properties],optional:file:../.env.rabbitmq[.properties]
musa.security.jwt.secret=${JWT_SECRET}

# Actualizaciones de encuestas
polls.events.enabled=${POLL_EVENTS_ENABLED:false}
polls.events.interval-ms=500
polls.allowed-origins=${MUSA_WEB_ORIGIN:http://localhost:*},http://127.0.0.1:*

# RabbitMQ local compartido con chat/notificaciones
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:musa}
spring.rabbitmq.connection-timeout=2s
spring.rabbitmq.requested-heartbeat=20s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.template.mandatory=false

# Conexiones a PostgreSQL
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.data-source-properties.connectTimeout=3
spring.datasource.hikari.data-source-properties.socketTimeout=10

# Evitar consultas fuera de las transacciones del servicio
spring.jpa.open-in-view=false

# Recursos HTTP
server.tomcat.threads.max=40
server.tomcat.threads.min-spare=4
server.tomcat.max-connections=300
server.tomcat.accept-count=50
server.tomcat.connection-timeout=10s
server.tomcat.keep-alive-timeout=15s