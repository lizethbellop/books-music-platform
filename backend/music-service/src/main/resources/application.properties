spring.config.import=optional:file:.env[.properties]
spring.application.name=music-service
server.port=${MUSIC_SERVICE_PORT:8080}

spring.datasource.url=jdbc:postgresql://localhost:5432/music_db
spring.datasource.username=music_user
spring.datasource.password=${MUSIC_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spotify.client-id=${SPOTIFY_CLIENT_ID:}
spotify.client-secret=${SPOTIFY_CLIENT_SECRET:}
spotify.token-url=https://accounts.spotify.com/api/token
spotify.api-url=https://api.spotify.com/v1

musa.security.jwt.secret=${JWT_SECRET}
