spring.config.import=optional:file:.env[.properties]
spring.application.name=profile-service
server.port=${PROFILE_SERVICE_PORT:8082}

spring.datasource.url=${PROFILE_DB_URL}
spring.datasource.username=${PROFILE_DB_USERNAME}
spring.datasource.password=${PROFILE_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
musa.security.jwt.secret=${JWT_SECRET}
musa.services.books.base-url=${BOOKS_SERVICE_URL:http://localhost:8081}
musa.services.music.base-url=${MUSIC_SERVICE_URL:http://localhost:8080}
