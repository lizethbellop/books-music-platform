spring.application.name=notification-service
server.port=${NOTIFICATION_SERVICE_PORT:8090}

spring.config.import=optional:file:../.env.rabbitmq[.properties],optional:file:./.env[.properties]

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=musa

spring.datasource.url=${NOTIFICATION_DB_URL}
spring.datasource.username=${NOTIFICATION_DB_USERNAME}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.open-in-view=false

spring.rabbitmq.listener.simple.acknowledge-mode=auto

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=2s

spring.rabbitmq.listener.simple.default-requeue-rejected=false

musa.security.jwt.secret=${JWT_SECRET}
spring.datasource.hikari.connection-timeout=5000
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
