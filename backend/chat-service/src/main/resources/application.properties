spring.application.name=chat-service
server.port=${CHAT_SERVICE_PORT:8088}

# .env local se interpreta como Java Properties desde chat-service.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env.rabbitmq[.properties]
spring.datasource.url=${CHAT_DB_URL:jdbc:postgresql://localhost:5432/chatdb}
spring.datasource.username=${CHAT_DB_USERNAME:chat_user}
spring.datasource.password=${CHAT_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

# Misma clave Base64 usada por users-service; no generar una diferente.
musa.security.jwt.secret=${JWT_SECRET}
musa.services.users.base-url=${USERS_SERVICE_URL:http://localhost:8083}
spring.jpa.open-in-view=false
spring.datasource.hikari.connection-timeout=5000
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

musa.chat.allowed-origins=${CHAT_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Activar después de aplicar database/migrations/001_notification_outbox.sql.
notifications.events.enabled=${NOTIFICATION_EVENTS_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:musa}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.connection-timeout=2s
