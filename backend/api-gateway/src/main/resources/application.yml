server:
  port: 8084

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/api/recommendations/**]':
                allowedOriginPatterns:
                  - "${MUSA_WEB_ORIGIN:http://localhost:*}"
                  - "http://127.0.0.1:*"
                allowedMethods:
                  - GET
                  - POST
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - Accept

              '[/api/v1/chat/**]':
                allowedOriginPatterns:
                  - "${MUSA_WEB_ORIGIN:http://localhost:*}"
                  - "http://127.0.0.1:*"
                allowedMethods:
                  - GET
                  - POST
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - Accept

              '[/api/v1/users/**]':
                allowedOriginPatterns:
                  - "${MUSA_WEB_ORIGIN:http://localhost:*}"
                  - "http://127.0.0.1:*"
                allowedMethods:
                  - GET
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - Accept

              '[/api/v1/notifications/**]':
                allowedOriginPatterns:
                  - "${MUSA_WEB_ORIGIN:http://localhost:*}"
                  - "http://127.0.0.1:*"
                allowedMethods:
                  - GET
                  - POST
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - Accept

              '[/api/v1/polls/**]':
                allowedOriginPatterns:
                  - "${MUSA_WEB_ORIGIN:http://localhost:*}"
                  - "http://127.0.0.1:*"
                allowedMethods:
                  - GET
                  - POST
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - Accept

              '[/api/v1/communities/*/polls/**]':
                allowedOriginPatterns:
                  - "${MUSA_WEB_ORIGIN:http://localhost:*}"
                  - "http://127.0.0.1:*"
                allowedMethods:
                  - GET
                  - POST
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - Accept

              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true

          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

          routes:
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8090}
              predicates:
                - Path=/api/v1/notifications/**

            - id: chat-websocket
              uri: ${CHAT_WS_URL:ws://localhost:8088}
              predicates:
                - Path=/api/v1/chat/ws

            - id: chat-service
              uri: ${CHAT_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/v1/chat/**

            - id: users-directory
              uri: ${USERS_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/users/**

            - id: users-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/auth/**

            - id: books-service
              uri: http://localhost:8081
              predicates:
                - Path=/books/**

            - id: music-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/music/**

            - id: statistics-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/statistics/**

            - id: profile-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/profiles,/api/profiles/**

            - id: social-service
              uri: ${SOCIAL_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/v1/social/**

            - id: recommendations-service
              uri: ${RECOMMENDATIONS_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/recommendations/**

            - id: polls-websocket
              uri: ${COMMUNITIES_WS_URL:ws://localhost:8086}
              predicates:
                - Path=/api/v1/polls/ws

            - id: community-polls
              uri: ${COMMUNITIES_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/polls/**,/api/v1/communities/*/polls,/api/v1/communities/*/polls/**