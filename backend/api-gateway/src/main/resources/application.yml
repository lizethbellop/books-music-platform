server:
  port: 8084

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true

          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

          routes:
            - id: users-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/auth/**

            - id: books-service
              uri: http://localhost:8081
              predicates:
                - Path=/books/**

            - id: music-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/music/**

            - id: statistics-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/statistics/**

            - id: profile-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/profiles,/api/profiles/**