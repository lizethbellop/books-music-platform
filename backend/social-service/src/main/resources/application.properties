spring.config.import=optional:file:.env[.properties],optional:file:../.env.rabbitmq[.properties]

spring.application.name=social-service

server.port=${SOCIAL_SERVICE_PORT:8089}


# =========================
# BASE DE DATOS
# =========================

spring.datasource.url=${SOCIAL_DB_URL:jdbc:postgresql://localhost:5432/social_db}
spring.datasource.username=${SOCIAL_DB_USERNAME:social_user}
spring.datasource.password=${SOCIAL_DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# Retención de publicaciones eliminadas
# =========================================================

musa.social.posts.retention-days=${POST_RETENTION_DAYS:30}

musa.social.posts.cleanup-cron=${POST_CLEANUP_CRON:0 0 3 * * *}


# =========================
# JPA / HIBERNATE
# =========================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# =========================
# JWT
# =========================

musa.security.jwt.secret=${JWT_SECRET}


# =========================
# OTROS MICROSERVICIOS
# =========================

musa.services.profile.base-url=${PROFILE_SERVICE_URL:http://localhost:8082}
musa.services.books.base-url=${BOOKS_SERVICE_URL:http://localhost:8081}
musa.services.music.base-url=${MUSIC_SERVICE_URL:http://localhost:8080}
musa.services.communities.base-url=${COMMUNITIES_SERVICE_URL:http://localhost:8086}
# Activar después de aplicar database/migrations/001_notification_outbox.sql.
notifications.events.enabled=${NOTIFICATION_EVENTS_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:musa}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.connection-timeout=2s
