name: books-home-recommendations
on:
  pull_request:
    paths:
      - 'backend/recommendations-service/**'
      - 'backend/profile-service/**'
      - 'backend/books-service/**'
      - 'backend/api-gateway/**'
      - 'frontend/**'
      - '.github/workflows/recommendations.yml'
  push:
    paths:
      - 'backend/recommendations-service/**'
      - 'backend/profile-service/**'
      - 'backend/books-service/**'
      - 'backend/api-gateway/**'
      - 'frontend/**'
      - '.github/workflows/recommendations.yml'
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: backend/recommendations-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/recommendations-service/requirements.lock
      - run: pip install -r requirements.lock
      - run: python -m pytest -q
  java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [profile-service, books-service, api-gateway]
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw test -DexcludedGroups=integration
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub lib/features/home lib/core/config/api_config.dart lib/core/routes/app_shell.dart test/home_recommendations_test.dart test/home_preview_test.dart lib/features/onboarding lib/features/auth/presentation/screens/register_screen.dart lib/features/auth/presentation/screens/login_screen.dart lib/main.dart test/preferences_onboarding_test.dart test/registration_onboarding_test.dart
      - run: flutter test --no-pub
